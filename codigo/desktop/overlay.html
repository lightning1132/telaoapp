<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Telão — por cima do jogo</title>
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:system-ui,"Segoe UI",sans-serif}
  #area{position:absolute;inset:0}
  .rx{position:absolute;bottom:6%;display:flex;flex-direction:column;align-items:center;animation:rise 3s ease-out forwards;will-change:transform,opacity}
  .rx b{font-size:52px;line-height:1;filter:drop-shadow(0 3px 8px rgba(0,0,0,.55))}
  .rx b.txt{font-size:30px;font-weight:800;color:#fff;-webkit-text-stroke:1px rgba(0,0,0,.4)}
  .rx b img{width:96px;height:96px;object-fit:contain;display:block}
  .rx i{display:flex;align-items:center;gap:5px;font-style:normal;font-size:13px;color:#fff;background:rgba(0,0,0,.6);border-radius:6px;padding:2px 8px;margin-top:3px;white-space:nowrap}
  .av{width:18px;height:18px;border-radius:50%;object-fit:cover}
  @keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}10%{transform:translateY(-8%) scale(1.15);opacity:1}
    70%{opacity:1}100%{transform:translateY(-320%) scale(1);opacity:0}}
  /* chat: mensagens empilhadas em baixo, somem sozinhas */
  #chat{position:absolute;left:8px;right:8px;bottom:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  .msg{max-width:100%;display:flex;gap:7px;align-items:flex-start;background:rgba(10,12,16,.82);color:#fff;border-radius:10px;padding:6px 10px;
    font-size:15px;line-height:1.35;box-shadow:0 4px 14px rgba(0,0,0,.4);animation:in .25s ease-out;transition:opacity .8s}
  .msg.fade{opacity:0}
  .msg .av{width:26px;height:26px;flex:none;margin-top:1px}
  .msg b{color:#7cf29a;font-weight:700;margin-right:5px}
  .msg span{word-break:break-word}
  .msg img.stk{display:block;max-width:120px;max-height:120px;margin-top:4px;border-radius:6px}
  @keyframes in{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>
<div id="area"></div>
<div id="chat"></div>
<script>
'use strict';
const area = document.getElementById('area'), chat = document.getElementById('chat');
const IMG = /^data:image\/(png|jpeg|webp|gif);base64,/;
function img(src, cls){ const i = document.createElement('img'); i.src = src; i.className = cls; i.alt = ''; return i; }
function react(it){
  if (area.childElementCount > 24) return;
  const el = document.createElement('div'); el.className = 'rx';
  el.style.left = (8 + Math.random() * 52) + '%';             // a janela já é uma faixa no lado direito do jogo
  const b = document.createElement('b');
  if (it.img && IMG.test(it.img)) b.appendChild(img(it.img, ''));
  else { b.textContent = String(it.text || '').slice(0, 16); if ([...b.textContent].length > 2) b.className = 'txt'; }
  const n = document.createElement('i');
  if (it.av && IMG.test(it.av)) n.appendChild(img(it.av, 'av'));
  n.append(String(it.who || '').slice(0, 24));
  el.append(b, n);
  el.addEventListener('animationend', () => el.remove());
  area.appendChild(el);
}
function message(it){
  const el = document.createElement('div'); el.className = 'msg';
  if (it.av && IMG.test(it.av)) el.appendChild(img(it.av, 'av'));
  const body = document.createElement('div');
  const who = document.createElement('b'); who.textContent = String(it.who || '').slice(0, 24);
  body.appendChild(who);
  if (it.text){ const t = document.createElement('span'); t.textContent = String(it.text).slice(0, 220); body.appendChild(t); }
  if (it.img && IMG.test(it.img)) body.appendChild(img(it.img, 'stk'));
  el.appendChild(body);
  chat.appendChild(el);
  while (chat.childElementCount > 5) chat.firstChild.remove();
  setTimeout(() => el.classList.add('fade'), 8000);
  setTimeout(() => el.remove(), 8900);
}
window.overlay.onItem(it => { if (!it || typeof it !== 'object') return; if (it.kind === 'chat') message(it); else react(it); });
</script>
</body>
</html>
